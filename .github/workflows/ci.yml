name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 最小权限：这个工作流只需要把代码读出来。
# 不写回仓库、不发包、不碰 issue / PR / packages，所以只留 contents: read。
permissions:
  contents: read

# 同一个 ref 上又推了一次，就把上一次还在跑的取消掉，别浪费 runner。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # 这两个只是让日志干净点，跟结果无关
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  # ==========================================================================
  # Lint —— 目前只是提示，不卡合并
  # ==========================================================================
  lint:
    name: Lint (ruff，仅提示)
    runs-on: ubuntu-latest
    # 这个 job 实测不到一分钟。不写的话默认是 GitHub 的 360 分钟，
    # 真卡住了就是白烧六小时的 runner，还看不出任何信号。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # ruff 钉死版本：不钉的话哪天 ruff 出新规则，一次没改代码的 push 也会变红。
      # 想升级就改这里，改完顺手看一眼新增了多少条。
      - name: 装 ruff
        run: python -m pip install "ruff==0.16.0"

      # ------------------------------------------------------------------
      # continue-on-error: true 是**故意**的，不是忘了删。
      #
      # 现状（ruff 0.16.0，跑 `ruff check .`）：全仓库 4628 条违规，
      # 其中 xiaozu_bot/ 1596 条、tests/ 2949 条、scripts/ 83 条、bot.py 0 条。
      # 数量前几名：ANN001 1049、Q000 557、ANN201 472、N802 413、
      # PLC2401 412（中文标识符）、E501 338、UP045 289、PLR2004 260。
      # 这些全是历史遗留，不是这次 CI 引入的。
      #
      # 直接设成阻塞 = CI 第一天就是红的，谁都不会再看它；
      # 为了让它变绿去批量改 xiaozu_bot/ 又是完全不相干的一次大改动。
      # 所以先让它跑起来、把结果以 annotation 的形式贴在 PR 的 diff 上，
      # 等哪天存量清干净了（比如按目录一块块收，或者先给 tests/ 单独放宽规则），
      # 再把这行 continue-on-error 删掉，变成真正的门禁。
      #
      # `ruff format --check` 这次**没加**：现在跑的话 61 个文件会被判定需要重排，
      # 纯噪音，等格式统一之后再单独加一步。
      #
      # 也**没加** pyright：这个仓库基本没写类型标注（光 ANN001 就 1049 条），
      # 现在上类型检查只会刷出几千条读都读不完的报错。等标注补得差不多了再说。
      # ------------------------------------------------------------------
      - name: ruff check（存量违规清干净之前不阻塞）
        continue-on-error: true
        run: ruff check --output-format=github .

      # 同样不阻塞，只是把分类统计打进日志，方便盯着存量往下掉。
      - name: ruff 违规统计
        continue-on-error: true
        run: ruff check --statistics .

  # ==========================================================================
  # 测试
  # ==========================================================================
  test:
    name: 测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # 装依赖 + 跑完全量实测两三分钟，20 分钟已经很宽裕了。
    # 加这个上限是因为「转而不是挂」的代码路径最难查：guess 的题库轮询以前
    # 在题库目录为空（也就是干净 checkout）时是死循环，现在已经改成有上限了，
    # 但再冒出一条同类的，我们要的是 20 分钟后红掉，不是 6 小时后。
    timeout-minutes: 20
    strategy:
      # 一个版本挂了，别把其他版本的结果一起掐掉 —— 不然看不出是普遍问题
      # 还是只有某个版本的问题。
      fail-fast: false
      matrix:
        # pyproject 写的是 requires-python = ">=3.10, <4.0"。
        # 依赖里最挑版本的是 nonebot-plugin-htmlkit（带二进制扩展的预发布版），
        # 它 0.1.0rc5 在 PyPI 上有 cp310-abi3 和 cp312-abi3 两组 manylinux_2_34
        # x86_64 wheel；abi3 向上兼容，所以 3.10 / 3.11 用 cp310-abi3，
        # 3.12 用 cp312-abi3，三个版本在 ubuntu-latest（glibc 2.39）上都有现成
        # 的轮子，不会退化成本地编译 Rust。
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # setup-python 自带的 pip 缓存，key 由 cache-dependency-path 的哈希算出来。
          # 依赖清单只有 pyproject.toml 一份，所以指它就够了。
          cache: pip
          cache-dependency-path: pyproject.toml

      # ------------------------------------------------------------------
      # 装依赖。这一串每一段都是实测出来的，别随手精简：
      #
      # 1. `-e .` —— 项目本体。**不需要 `--pre`**：pyproject 里写的是
      #    `nonebot-plugin-htmlkit>=0.1.0rc5`，版号本身就是预发布，按 PEP 440
      #    pip 会自动放行该包的预发布版。实测 `pip install -e .` 直接就把
      #    0.1.0rc5 装上了。
      #
      # 2. `[migrate]` —— 也就是 redis。tests/test_json_storage.py 里
      #    TestMigrateScriptRun 那个 fixture 现在是 `pytest.importorskip("redis")`，
      #    没装也只会 SKIP 不会 ERROR。但我们**希望这 8 个用例在 CI 上真的跑**
      #    （搬家脚本坏了得有人知道），所以这里显式装上。
      #    换句话说：装它是为了多测一点，不是为了绕过什么。
      #
      # 3. 测试工具单独列，**没有**用 `.[dev]`：dev extra 里有 `pyright[nodejs]`，
      #    会顺带拖一整个 Node 运行时下来，而这个工作流根本不跑类型检查。
      #
      # 4. **没装** `[tts]`：里面的 mlx-audio 只有 Apple Silicon 的包，
      #    Linux runner 上装不上。say 插件是在 handler 里才 import 它的，
      #    不装不影响任何插件加载，也不影响测试。
      #
      # 5. pillow **不钉版本**，跟着 pyproject 的 `pillow>=10.0.0` 走。
      #    这里以前钉着 `pillow<12`，因为 guess 的 get_variance() 用了
      #    Pillow 12 才标废弃的 image.getdata()，撞上 pytest 的
      #    `error::DeprecationWarning:xiaozu_bot` 会挂 19 个用例。
      #    现在 get_variance() 改成 ImageStat 了，装最新的 Pillow 就行 ——
      #    CI 装的依赖集必须和用户实际装到的一样，否则测了个寂寞。
      # ------------------------------------------------------------------
      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[migrate]" \
            pytest pytest-asyncio pytest-cov

      - name: 记一下实际装了什么版本
        run: python -m pip list

      # ------------------------------------------------------------------
      # 干净检出守卫 —— 这一步专门盯「本地过、CI 挂」里最常见的那一类：
      # import 期的文件系统副作用。
      #
      # 每个插件在**模块级**就 `r = JsonRedis(plugin_storage(__file__))`，
      # 而 JsonRedis 会把 xiaozu_bot/plugins/<x>/data/storage.json 连同目录
      # 一起建出来。开发机上这些 data/ 早就存在了，从来不会暴露问题；
      # CI 上是全新检出，data/ 一个都没有（git 里没有任何 data/ 下的文件，
      # 全被 .gitignore 挡掉了），所有目录都是这一刻现建的。
      #
      # 只做收集（--collect-only）就足以 import 到每一个插件模块，
      # 比跑全量快得多，还顺带验证了这个 Python 版本上所有模块都 import 得动。
      #
      # 跑完 git status 必须是空的。实测这一步会新建 5 个文件：
      #   game / gdlevelsearch / guess / jrrp / zhua 各一个 data/storage.json，
      # 五个都已经在 .gitignore 里，所以 git status 看不见它们。
      # 以后谁加了新插件却忘了配 .gitignore，会在这里就红，
      # 而不是等到某次 commit 不小心把 storage.json 混进去。
      # ------------------------------------------------------------------
      - name: 干净检出守卫（import 期文件副作用）
        run: |
          echo "::group::检出后、import 前"
          existing="$(find xiaozu_bot/plugins -type d -name data 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            echo "$existing"
            echo "::error::全新检出里不该存在任何 data/ 目录，说明它们被误提交进 git 了"
            exit 1
          fi
          echo "（没有 data/ 目录，符合预期）"
          echo "::endgroup::"

          python -m pytest tests --collect-only -q > /dev/null

          echo "::group::import 之后新建出来的 data/ 目录"
          find xiaozu_bot/plugins -type d -name data 2>/dev/null || true
          echo "::endgroup::"

          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::import 期产生了没被 .gitignore 覆盖的文件，请补 .gitignore"
            exit 1
          fi
          echo "工作区干净。"

      # coverage.xml 和 htmlcov/ 都已经在 .gitignore 里，所以下一步的
      # 「测试有没有往工作区写东西」还能继续用 git status 判断。
      - name: 跑测试
        run: |
          python -m pytest tests \
            --cov=xiaozu_bot \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html

      # 仓库的测试约定是「只许往 pytest 的 tmp_path 写」。这一步把它变成硬约束：
      # 有用例把文件落进了工作区（且没被 .gitignore 挡住）就直接红。
      - name: 测试不许污染工作区
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::测试往仓库工作区写了东西，请改成写 tmp_path"
            exit 1
          fi
          echo "工作区干净。"

      # 只传成品，不接 Codecov 之类的第三方 —— 那需要仓库还没配的 token。
      # 想看覆盖率就到这次 run 的 Artifacts 里把 zip 下下来，
      # htmlcov/index.html 直接用浏览器打开。
      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # upload-artifact v4 不允许重名，所以带上 Python 版本
          name: coverage-py${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14
          if-no-files-found: warn
