# 显式声明构建后端。不写的话 pip 会退到 setuptools.build_meta:__legacy__，
# 并且每次构建都从 PyPI 现拉一个不定版本的 setuptools 进隔离环境。
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# 打包哪些目录也必须写死。默认的 flat-layout 自动发现会把仓库根下**任何**
# 带 .py 的目录都当成顶层包，于是：
#   - scripts/try_search.py 跑一次会生成 temp/，之后 `pip install -e .` 直接报
#     「Multiple top-level packages discovered in a flat-layout: ['temp', 'xiaozu_bot']」；
#   - 以后谁在根目录再放个包，同样会炸。
# CI 是干净 checkout 所以之前没暴露，但 README 让贡献者先跑 try_search 再装，
# 照着做一遍就会踩到。
#
# namespaces = true 是 pyproject 下的默认值，这里显式写出来是因为它不能少：
# xiaozu_bot/ 和 xiaozu_bot/plugins/ 都**没有** __init__.py（PEP 420 命名空间包），
# 关掉的话 find 一个包都扫不到，装出来是个空壳。
# 实测这套配置打出来的 wheel 里有全部 52 个 .py，顶层只有 xiaozu_bot/。
[tool.setuptools.packages.find]
include = ["xiaozu_bot*"]
namespaces = true

[project]
name = "xiaozu-bot"
version = "0.1.0"
description = "xiaozu-bot"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "nonebot2[fastapi,httpx,websockets]>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot-plugin-localstore>=0.7.4",
    "nonebot-plugin-htmlkit>=0.1.0rc5",
    # 以下是插件实际 import 但之前漏写的依赖
    "requests>=2.31.0",          # gdlevelsearch 各 api 与 updater
    "emoji>=2.0.0",              # ai
    "certifi>=2024.2.2",         # updater 的 ssl context
    "urllib3>=2.0.0",            # updater/jobs/googlesheetapi
    "google-api-python-client>=2.100.0",  # updater 抓 Google Sheets
    "pillow>=10.0.0",            # gdlevelsearch/draw.py
]

[project.optional-dependencies]
dev = [
    "pyright[nodejs]",
    "ruff",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]
# mlx_audio 只能装在 Apple Silicon 上，放进必选依赖会让别的平台整个装不上。
# say 插件是在 handler 里才 import 它的，所以不装也不影响其他插件加载。
tts = [
    "mlx-audio",
]
# 所有插件都改用 JsonRedis 了，bot 本身不再需要 redis。
# 只有 scripts/migrate_redis_to_json.py 要拿它把老数据搬出来，搬完就可以卸了。
migrate = [
    "redis>=5.0.0",
]

# PEP 735 规定 dependency-groups 是**顶层**表，不是 [project] 的子表。
# 之前写成 [project.dependency-groups]，setuptools 校验 [project] 时会直接报
# 「`project` must not contain {'dependency-groups'} properties」，
# 于是 `pip install -e .` 整个装不上 —— CI 第一次跑就会挂在装依赖这一步。
[dependency-groups]
dev = [
    "pyright",
    "ruff",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[tool.pytest.ini_options]
# 测试只在 tests/ 下面，别去扫 xiaozu_bot/ 和 scripts/
testpaths = ["tests"]
# tests/ 下有 __init__.py，是个包；仓库根目录必须在 sys.path 上，
# 这样 `import xiaozu_bot` 和 `import tests.xxx` 都能成。
# （tests/conftest.py 里也塞了一遍，双保险：直接 python 跑单个文件时也管用。）
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# auto：async def 的测试函数自动当 asyncio 用例跑，不用每个都记得加
# @pytest.mark.asyncio。这个仓库里几乎所有 handler 都是 async 的，
# 有 7 个人并行写测试，少一个能忘的步骤就少一类翻车。
asyncio_mode = "auto"
# pytest-asyncio 1.x 不显式设这个会刷 deprecation warning；
# function 作用域 = 每个用例一个全新事件循环，用例之间不会串。
asyncio_default_fixture_loop_scope = "function"
# 这里**不要**加 --strict-config。它会把「不认识的配置项」变成 usage error
# （exit 4，一个用例都不收集），而「不认识」包括「这台机器没装那个插件」：
# 本地装了 pytest-timeout 后在这里写 timeout = 60，CI 没装就整个跑不起来，
# 而且没有任何测试输出。为了抓配置笔误而把笔误升级成全线停摆，不划算。
addopts = "-ra"
filterwarnings = [
    # 基线是 default 而不是 error。理由：模块级 import 时发出的 warning
    # 每个进程只触发一次，全局 error 的话「哪个用例先 import 就哪个用例挂」，
    # 结果依赖执行顺序 —— 这正是我们要避免的不稳定。
    "default",
    # 这里以前有两条 `error::DeprecationWarning:xiaozu_bot` /
    # `error::PendingDeprecationWarning:xiaozu_bot`，已经删掉了。原因：
    # 过滤器第三段匹配的是「警告归给了哪个模块」，也就是三方库按 stacklevel
    # 算出来的**调用方**。所以它抓的根本不是「仓库自己写了废弃用法」，
    # 而是「某个依赖废弃了我们在调的 API」—— 那是别人的发版节奏，不是我们的。
    # 实测代价：Pillow 12 把 image.getdata() 标废弃，一次依赖升级就同时挂 19 个
    # 用例，而且 error 不进 __warningregistry__、不去重，19 条报错没有一条提到
    # 「废弃」，看起来就像 bot 整个坏了。
    # 现在按 "default" 处理：照样出现在结尾的 warnings summary 里，看得见，
    # 但不会在你没动过代码的那天把 CI 变红。升级完依赖记得扫一眼那段 summary。
    # 三方库的噪音，仓库这边改不了
    "ignore::FutureWarning:google.*",
    "ignore::DeprecationWarning:google.*",
    "ignore::DeprecationWarning:googleapiclient.*",
    "ignore::DeprecationWarning:httpx.*",
    "ignore::DeprecationWarning:pydantic.*",
    # 没登记的 marker 只警告不报错 —— 不然并行加测试的人会被卡住
    "default::pytest.PytestUnknownMarkWarning",
]
markers = [
    "slow: 跑得慢的用例（Pillow 合图、字体加载），平时可以 -m 'not slow' 跳过",
    "updater: gdlevelsearch/updater 相关的用例",
]

[tool.nonebot]
plugin_dirs = ["xiaozu_bot/plugins"]
builtin_plugins = []

[tool.nonebot.adapters]
nonebot-adapter-onebot = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
"@local" = []

[tool.nonebot.plugins]
"@local" = []
nonebot-plugin-apscheduler = ["nonebot_plugin_apscheduler"]
nonebot-plugin-localstore = ["nonebot_plugin_localstore"]
nonebot-plugin-htmlkit = ["nonebot_plugin_htmlkit"]
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
# For more rules, see https://docs.astral.sh/ruff/rules/.
select = [
    "F",     # Pyflakes
    "W",     # pycodestyle warnings
    "E",     # pycodestyle errors
    "I",     # isort
    "C90",   # mccabe
    "N",     # pep8-naming
    "PL",    # pylint
    "UP",    # pyupgrade
    "YTT",   # flake8-2020
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "BLE",   # flake8-blind-except
    "FBT",   # flake8-boolean-trap
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "ICN",   # flake8-import-conventions
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "PYI",   # flake8-pyi
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "SLOT",  # flake8-slots
    "TID",   # flake8-tidy-imports
    "TC",    # flake8-type-checking
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    # "ERA",   # eradicate
    "FAST",  # FastAPI
    "PERF",  # Perflint
    "PGH",   # pygrep-hooks
    "FURB",  # refurb
    "TRY",   # tryceratops
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E402",    # module-import-not-at-top-of-file  # nonebot2 require() violates this
    "B008",    # function-call-in-default-argument  # nonebot2 Depends() without Annotated violates this
    "UP037",   # quoted-annotation
    # "RUF001",  # ambiguous-unicode-character-string
    # "RUF002",  # ambiguous-unicode-character-docstring
    # "RUF003",  # ambiguous-unicode-character-comment
    "ANN202",  # missing-return-type-private-function
    "ANN401",  # any-type
    "COM812",  # missing-trailing-comma
    "PLC0415", # import-outside-top-level

    # --- 下面这几条是**故意**关掉的，不是还没来得及修 ---
    # 加它们之前 `ruff check .` 有 4712 条违规，其中约八成落在这几类里，
    # 而这几类要么是这个仓库的既定风格，要么根本不该由 linter 来管。
    # 存量太大的直接后果是：CI 的 lint 只能设成不阻塞，每个 PR 贴十条
    # 跟你这次改动毫无关系的 annotation —— 贴几次之后你就再也不看它了。
    # 关掉这些之后剩下的才是真正值得看的。
    "PLC2401", # non-ascii-name —— 这个仓库**故意**用中文标识符，412 条，永远不会改
    "ANN001",  # missing-type-function-argument —— 1049 条；README 已经写明不上类型检查
    "ANN201",  # missing-return-type-undocumented-public-function —— 472 条，同上
    "Q000",    # bad-quotes-inline-string —— 557 条；引号风格是 `ruff format` 的活，不是 lint 的
    "N802",    # invalid-function-name —— 413 条，基本都是既有的 handler 命名
    "E501",    # line-too-long —— 338 条，纯观感
]

allowed-confusables = ["，", "。", "“", "”", "：", "；", "？", "！", "【", "】", "《", "》", "…", "—", "（", "）", "、"]

# 测试代码和生产代码的标准本来就不一样：
# 用例函数不写类型标注、断言里直接写字面量数字、大量使用 assert，
# 这些在 tests/ 里都是正常的。4712 条里有 3033 条出自 tests/。
#
# 这一段必须放在 [tool.ruff.lint] 的普通键（上面的 allowed-confusables）
# **后面**：TOML 里子表头之后的所有键都算进子表，放前面的话
# allowed-confusables 会被当成 per-file-ignores 的一项，
# ruff 直接报 `Unknown rule selector '，'`。
[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ANN",     # 用例不写类型标注
    "PLR2004", # magic-value-comparison —— 断言里当然全是字面量
    "S101",    # assert —— 用例的全部意义就是 assert
    "PLR0915", # too-many-statements —— 长一点的场景用例可以接受
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pyright]
# For Pylance/Pyright configurations, see https://microsoft.github.io/pyright/#/configuration.
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "standard"
