# 显式声明构建后端。不写的话 pip 会退到 setuptools.build_meta:__legacy__，
# 并且每次构建都从 PyPI 现拉一个不定版本的 setuptools 进隔离环境。
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# 打包哪些目录也必须写死。默认的 flat-layout 自动发现会把仓库根下**任何**
# 带 .py 的目录都当成顶层包，于是：
#   - scripts/try_search.py 跑一次会生成 temp/，之后 `pip install -e .` 直接报
#     「Multiple top-level packages discovered in a flat-layout: ['temp', 'xiaozu_bot']」；
#   - 以后谁在根目录再放个包，同样会炸。
# CI 是干净 checkout 所以之前没暴露，但 README 让贡献者先跑 try_search 再装，
# 照着做一遍就会踩到。
#
# namespaces = true 是 pyproject 下的默认值，这里显式写出来是因为它不能少：
# xiaozu_bot/ 和 xiaozu_bot/plugins/ 都**没有** __init__.py（PEP 420 命名空间包），
# 关掉的话 find 一个包都扫不到，装出来是个空壳。
# 实测这套配置打出来的 wheel 里有全部 52 个 .py，顶层只有 xiaozu_bot/。
[tool.setuptools.packages.find]
include = ["xiaozu_bot*"]
namespaces = true

[project]
name = "xiaozu-bot"
version = "0.1.0"
description = "xiaozu-bot"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "nonebot2[fastapi,httpx,websockets]>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot-plugin-localstore>=0.7.4",
    "nonebot-plugin-htmlkit>=0.1.0rc5",
    "requests>=2.31.0",
    "emoji>=2.0.0",
    "certifi>=2024.2.2",
    "urllib3>=2.0.0",
    "google-api-python-client>=2.100.0",
    "pillow>=10.0.0",
    "nonebot-adapter-qq>=1.7.1",
]

[project.optional-dependencies]
dev = [
    "pyright[nodejs]",
    "ruff",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]
# mlx_audio 只能装在 Apple Silicon 上，放进必选依赖会让别的平台整个装不上。
# say 插件是在 handler 里才 import 它的，所以不装也不影响其他插件加载。
tts = [
    "mlx-audio",
]
# 所有插件都改用 JsonRedis 了，bot 本身不再需要 redis。
# 只有 scripts/migrate_redis_to_json.py 要拿它把老数据搬出来，搬完就可以卸了。
migrate = [
    "redis>=5.0.0",
]

# PEP 735 规定 dependency-groups 是**顶层**表，不是 [project] 的子表。
# 之前写成 [project.dependency-groups]，setuptools 校验 [project] 时会直接报
# 「`project` must not contain {'dependency-groups'} properties」，
# 于是 `pip install -e .` 整个装不上 —— CI 第一次跑就会挂在装依赖这一步。
[dependency-groups]
dev = [
    "pyright",
    "ruff",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[tool.pytest.ini_options]
# 测试只在 tests/ 下面，别去扫 xiaozu_bot/ 和 scripts/
testpaths = ["tests"]
# tests/ 下有 __init__.py，是个包；仓库根目录必须在 sys.path 上，
# 这样 `import xiaozu_bot` 和 `import tests.xxx` 都能成。
# （tests/conftest.py 里也塞了一遍，双保险：直接 python 跑单个文件时也管用。）
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# auto：async def 的测试函数自动当 asyncio 用例跑，不用每个都记得加
# @pytest.mark.asyncio。这个仓库里几乎所有 handler 都是 async 的，
# 有 7 个人并行写测试，少一个能忘的步骤就少一类翻车。
asyncio_mode = "auto"
# pytest-asyncio 1.x 不显式设这个会刷 deprecation warning；
# function 作用域 = 每个用例一个全新事件循环，用例之间不会串。
asyncio_default_fixture_loop_scope = "function"
# 这里**不要**加 --strict-config。它会把「不认识的配置项」变成 usage error
# （exit 4，一个用例都不收集），而「不认识」包括「这台机器没装那个插件」：
# 本地装了 pytest-timeout 后在这里写 timeout = 60，CI 没装就整个跑不起来，
# 而且没有任何测试输出。为了抓配置笔误而把笔误升级成全线停摆，不划算。
addopts = "-ra"
filterwarnings = [
    # 基线是 default 而不是 error。理由：模块级 import 时发出的 warning
    # 每个进程只触发一次，全局 error 的话「哪个用例先 import 就哪个用例挂」，
    # 结果依赖执行顺序 —— 这正是我们要避免的不稳定。
    "default",
    # 这里以前有两条 `error::DeprecationWarning:xiaozu_bot` /
    # `error::PendingDeprecationWarning:xiaozu_bot`，已经删掉了。原因：
    # 过滤器第三段匹配的是「警告归给了哪个模块」，也就是三方库按 stacklevel
    # 算出来的**调用方**。所以它抓的根本不是「仓库自己写了废弃用法」，
    # 而是「某个依赖废弃了我们在调的 API」—— 那是别人的发版节奏，不是我们的。
    # 实测代价：Pillow 12 把 image.getdata() 标废弃，一次依赖升级就同时挂 19 个
    # 用例，而且 error 不进 __warningregistry__、不去重，19 条报错没有一条提到
    # 「废弃」，看起来就像 bot 整个坏了。
    # 现在按 "default" 处理：照样出现在结尾的 warnings summary 里，看得见，
    # 但不会在你没动过代码的那天把 CI 变红。升级完依赖记得扫一眼那段 summary。
    # 三方库的噪音，仓库这边改不了
    "ignore::FutureWarning:google.*",
    "ignore::DeprecationWarning:google.*",
    "ignore::DeprecationWarning:googleapiclient.*",
    "ignore::DeprecationWarning:httpx.*",
    "ignore::DeprecationWarning:pydantic.*",
    # 没登记的 marker 只警告不报错 —— 不然并行加测试的人会被卡住
    "default::pytest.PytestUnknownMarkWarning",
]
markers = [
    "slow: 跑得慢的用例（Pillow 合图、字体加载），平时可以 -m 'not slow' 跳过",
    "updater: gdlevelsearch/updater 相关的用例",
]

[tool.nonebot]
plugin_dirs = ["xiaozu_bot/plugins"]
builtin_plugins = []

[tool.nonebot.adapters]
nonebot-adapter-onebot = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
"@local" = []
nonebot-adapter-qq = [{name = "QQ", module_name = "nonebot.adapters.qq"}]

[tool.nonebot.plugins]
"@local" = []
nonebot-plugin-apscheduler = ["nonebot_plugin_apscheduler"]
nonebot-plugin-localstore = ["nonebot_plugin_localstore"]
nonebot-plugin-htmlkit = ["nonebot_plugin_htmlkit"]
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
# For more rules, see https://docs.astral.sh/ruff/rules/.
select = [
    "F",     # Pyflakes
    "W",     # pycodestyle warnings
    "E",     # pycodestyle errors
    "I",     # isort
    "C90",   # mccabe
    "N",     # pep8-naming
    "PL",    # pylint
    "UP",    # pyupgrade
    "YTT",   # flake8-2020
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "BLE",   # flake8-blind-except
    "FBT",   # flake8-boolean-trap
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "ICN",   # flake8-import-conventions
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "PYI",   # flake8-pyi
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "SLOT",  # flake8-slots
    "TID",   # flake8-tidy-imports
    "TC",    # flake8-type-checking
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    # "ERA",   # eradicate
    "FAST",  # FastAPI
    "PERF",  # Perflint
    "PGH",   # pygrep-hooks
    "FURB",  # refurb
    "TRY",   # tryceratops
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E402",    # module-import-not-at-top-of-file  # nonebot2 require() violates this
    "B008",    # function-call-in-default-argument  # nonebot2 Depends() without Annotated violates this
    "UP037",   # quoted-annotation
    # "RUF001",  # ambiguous-unicode-character-string
    # "RUF002",  # ambiguous-unicode-character-docstring
    # "RUF003",  # ambiguous-unicode-character-comment
    "ANN202",  # missing-return-type-private-function
    "ANN401",  # any-type
    "COM812",  # missing-trailing-comma
    "PLC0415", # import-outside-top-level

    # --- 下面这几条是**故意**关掉的，不是还没来得及修 ---
    # 加它们之前 `ruff check .` 有 4712 条违规，其中约八成落在这几类里，
    # 而这几类要么是这个仓库的既定风格，要么根本不该由 linter 来管。
    # 存量太大的直接后果是：CI 的 lint 只能设成不阻塞，每个 PR 贴十条
    # 跟你这次改动毫无关系的 annotation —— 贴几次之后你就再也不看它了。
    # 关掉这些之后剩下的才是真正值得看的。
    "PLC2401", # non-ascii-name —— 这个仓库**故意**用中文标识符，412 条，永远不会改
    "ANN001",  # missing-type-function-argument —— 1049 条；README 已经写明不上类型检查
    "ANN201",  # missing-return-type-undocumented-public-function —— 472 条，同上
    "Q000",    # bad-quotes-inline-string —— 557 条；引号风格是 `ruff format` 的活，不是 lint 的
    "N802",    # invalid-function-name —— 413 条，基本都是既有的 handler 命名
    "E501",    # line-too-long —— 338 条，纯观感

    # --- 第二批：跑完 `ruff check --fix` 之后剩下的房规 ---
    # 判断标准是「这是本仓库刻意的写法，还是欠债」。下面每一条都属于前者，
    # 而且都是逐条读过代码之后才关的，不是嫌多。
    "TID252",  # relative-imports —— 在这个 PEP 420 插件树里父级相对 import 就是对的写法。
               # 而且 updater/jobs/*.py 那一圈 `try: from ..paths import X /
               # except ImportError: from updater.paths import X` 正是
               # `python scripts/run_updater.py`（不起 bot 单独抓数据）能跑的前提。
    "BLE001",  # blind-except —— 11 处全都是 `except Exception:` + `logger.exception` + 注释，
               # 是「一个数据源挂了别连累另外两个」的正确写法。一个要长期在线的 bot
               # 需要的就是这个，不该被 linter 逼着改成精确捕获。
    "PLW0603", # global-statement —— 模块级缓存单例（notify 的去重键、say 的懒加载模型、
               # platapi 的 reload 重绑）。7 条里有 5 条来自 platapi.py 同一行 global。
    "TRY003",  # raise-vanilla-args —— 本仓库习惯在 raise 处直接写中文的用户可见消息，
               # 而不是为每种错误定义一个异常类。对这个体量的项目是合适的。
    "PLR2004", # magic-value-comparison —— game / joy / jrrp 本来就是数值逻辑，
               # 把 `hp <= 0` 里的 0 抽成常量并不会让它更好读。
    "PLR0913", # too-many-arguments —— 记录型构造器，draw.py 的 create_level_image 有 26 个参数，
               # 那是「一张图要画的所有字段」，拆开只会更糟。
    "PLR0917", # too-many-positional-arguments —— 和 PLR0913 几乎重复，而且它会**穿过**
               # 已有的 `# noqa: PLR0913` 再报一遍（draw.py:311、platapi.py:11 都中枪），
               # 属于双重计数。

    # --- 第三批：把 lint 变成门禁前的最后一批 ---
    # 到这一步存量已经从 1232 降到 ~100，剩下的全是「结构性的、改了没好处」的。
    # 因为下面要把 lint 设成阻塞门禁（非零退出码就红），所以必须清到 0 —— 剩下的
    # 这些不是"以后再修"，是**明确决定不修**。
    "FBT001", # boolean-type-hint-positional-argument
    "FBT002", # boolean-default-value-positional-argument
    "FBT003", # boolean-positional-value-in-call
              # 上面三条：updater/jobs 下的 nlw/ids/lw/hds 四个抓取任务**故意**保持
              # 同一个签名 fetch_levels(service, sheet_name, platformer, pending)，
              # 好让 runner 统一调。为了满足 linter 把它们改成关键字-only，
              # 反而会打破这份对称。
    "F811",   # redefined-while-unused —— joy/say 里那 8 个重名的 handle_function 是
              # NoneBot 的惯用写法：每个都挂在**不同的** matcher 装饰器上，
              # 装饰器已经把函数对象拿走了，模块级的名字重不重名无所谓。
              # （唯一一条真问题 —— metadata.py 里 `import http` 被 requests.Session()
              #   盖掉 —— 已经在这轮删掉了。）
    "ARG001", # unused-function-argument —— 剩下的全是框架/对称签名要求的形参：
              # NoneBot handler 的 bot/event/arg（按类型注入，用不用得上都得声明），
              # 以及上面说的四个抓取任务里只有 lw 会用的 pending。
              # 注意 pending **不能**改名成 _pending：调用方是按关键字传的。
    "TC003",  # typing-only-standard-library-import —— 把只在注解里用到的 import 挪进
              # TYPE_CHECKING 块，对一个不跑类型检查的仓库来说是纯增加噪音。
    "N803",   # invalid-argument-name —— sheet_ID 这种；N802 已经关了，保持一致。
    "N801",   # invalid-class-name
    "N818",   # error-suffix-on-exception-name
    "A002",   # builtin-argument-shadowing —— PlatInfo/PlatDiff 的 __init__ 参数叫 id，
              # 是因为上游 JSON 里那个字段就叫 id（data.get('id')），跟着叫更好懂。
              # 而且这两个类是按关键字构造的（id=...），改名要连着改 4 个文件和属性名，
              # 为一条纯观感的规则不值得。
    "C901",   # complex-structure
    "PLR0912", # too-many-branches
    "PLR0911", # too-many-return-statements
    "PLR0915", # too-many-statements
              # 上面四条：阈值已经放宽过一轮（见下面 mccabe/pylint 段）。还超的那几个
              # 里最夸张的是 game 的 prop_demon_handle（复杂度 73），它确实该重构，
              # 但那是改 live 的游戏逻辑，应该单独做，不该由 lint 卡着不让合并。
    "PERF203", # try-except-in-loop —— 逐个数据源抓取时「单个失败不影响其他」正是要
              # 在循环里 try 的。
    "TRY300",  # try-consider-else
    "TRY301",  # raise-within-try
    "PTH105", "PTH107", "PTH109", "PTH118", "PTH123",
              # os.replace / os.remove / os.getcwd / os.path.join / open —— 这几个都是
              # **刻意**用 os 层的：paths.publish() 和 JsonRedis._save() 靠 os.replace
              # 的原子性保证「不会读到写一半的文件」，注释里写得很清楚。
              # Path.replace 底层是同一个系统调用，但把这些改掉只是换个写法、
              # 没有任何收益，反而会让那几段注释对不上代码。
    "F403", "F405",
              # star import —— roulette 的 `from .const import *` 是把常量表整个拉进来，
              # 这个用法在这里是清楚的。
    "B007",   # unused-loop-control-variable
    "ANN002", "ANN003", "ANN205",  # *args/**kwargs/staticmethod 的类型标注，
              # 和已经关掉的 ANN001/ANN201 是一回事
    "RUF043", # pytest-raises-ambiguous-pattern
    "PLC3002", # unnecessary-direct-lambda-call
    "PLW2901", # redefined-loop-name
    "PIE810", # multiple-starts-ends-with
    "DTZ005", # call-datetime-now-without-tzinfo —— 这个 bot 全程用本地时间，
              # 每日人品、对局超时都是按本地时区算的，加 tz 反而要改语义
    "SIM105", # suppressible-exception
]

# 追加了三个字符：
#   ×  (U+00D7)  帮助文本里的乘号，xiaozubot_help/commands.py 用了 6 次
#   𝕏  (U+1D54F) constants.py 里那个推特/X 的 logo 字形
#   １ (U+FF11)  tests 里**故意**测全角数字输入的那条用例，是断言的一部分
allowed-confusables = ["，", "。", "“", "”", "：", "；", "？", "！", "【", "】", "《", "》", "…", "—", "（", "）", "、", "×", "𝕏", "１"]

# 复杂度阈值。默认值（10 / 12 / 50）对这个仓库偏严：
# 一个多几个 elif 的 handler 就会中招，而那类函数拆开并不会更好读。
# 调到下面这组之后，剩下报出来的才是真正该拆的。
# 唯一的巨兽是 game 的 prop_demon_handle（复杂度 73、91 个分支、320 条语句，
# 一整条 `elif item_name == ...` 的道具分发链）—— 它值得单独重构一次，
# 但那是改 live 的游戏逻辑，不该由 lint 来推动，所以这里不为它放宽。
[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-branches = 15
max-statements = 80

# 测试代码和生产代码的标准本来就不一样：
# 用例函数不写类型标注、断言里直接写字面量数字、大量使用 assert，
# 这些在 tests/ 里都是正常的。4712 条里有 3033 条出自 tests/。
#
# 这一段必须放在 [tool.ruff.lint] 的普通键（上面的 allowed-confusables）
# **后面**：TOML 里子表头之后的所有键都算进子表，放前面的话
# allowed-confusables 会被当成 per-file-ignores 的一项，
# ruff 直接报 `Unknown rule selector '，'`。
[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ANN",     # 用例不写类型标注
    "PLR2004", # magic-value-comparison —— 断言里当然全是字面量
    "S101",    # assert —— 用例的全部意义就是 assert
    "PLR0915", # too-many-statements —— 长一点的场景用例可以接受

    # ARG 这一族**必须**在 tests/ 里关掉，不是图省事：
    # 109 条 ARG002 里有 103 条是 pytest 的 fixture 名 —— 用例函数把 fixture 写进
    # 参数列表就是为了触发它的副作用（monkeypatch、建临时目录），函数体里当然不用它。
    # 而 pytest 是**严格按参数名**解析 fixture 的，照 linter 说的改成 `_name`
    # 直接就是 `fixture '_name' not found`，整批用例挂掉。
    # 剩下的 ARG005 是 monkeypatch 用的 lambda 桩，形参个数必须和被替换的函数对齐。
    "ARG",
    "SIM300",  # yoda-conditions —— 自动修会把 `assert runner.JOBS == {...}` 倒过来写成
               # `assert {...} == runner.JOBS`，断言的可读性反而变差了
    "RUF059",  # unused-unpacked-variable —— `a, _b = ...` 在用例里很正常
    "DTZ001",  # 用例 fixture 里用不带时区的 datetime 是对的
    "ASYNC240", # 用例里在 async 函数中碰 Path 无所谓，不是真的在跑事件循环
    "RUF012",  # mutable-class-default —— 用例里的类属性容器
    "B905",    # zip 不写 strict —— 用例里两边长度是自己造的
]

# conftest.py 里那 13 个 `# noqa: E402` 必须留着。
# E402 本来就在全局 ignore 里，所以这些 noqa 确实"没用"，RUF100 会想删掉它们 ——
# 但它们是那份**载荷性 import 顺序**（先塞 sys.path、再 nonebot.init()、
# 最后才 import 适配器和仓库代码）唯一的现场标记。删了之后，
# 下一个动这个文件的人没有任何提示告诉他这里的顺序不能乱。
"tests/conftest.py" = ["RUF100"]

# scripts/ 是命令行工具，print 就是它的输出方式，不是调试残留。
# 63 条 T201 里有 62 条在这儿。
"scripts/*" = ["T201", "ASYNC240"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pyright]
# For Pylance/Pyright configurations, see https://microsoft.github.io/pyright/#/configuration.
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "standard"
